[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidx"
version = "0.4.5"
description = "Scripture video rendering engine for Bible translation teams (combines USFM files, timing maps, audio, and FFmpeg)."
authors = [
    {name = "benVar"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=5.4.1",
    "rich>=13.0.0",
    "mutagen>=1.45.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
align = [
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
    "uroman>=1.3.1",
]
youtube = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-api-python-client>=2.100.0",
]

[project.scripts]
vidx = "vidx.cli:main"

# Declare the package explicitly. Without this, setuptools' auto-discovery sees
# the src/ directory (scripture data, not code), assumes a src-layout project,
# finds no packages under it, and silently builds a wheel containing nothing but
# metadata -- so `pip install vidx-*.whl` and `pip install -e .` both yield
# "ModuleNotFoundError: No module named 'vidx'" from the console script.
[tool.setuptools]
packages = ["vidx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
