# ==============================================================================
# Mavilan Tulu (Malayalam script) — Gospel of Mark, FHD 16:9
# ==============================================================================
#   vidx -c examples/tcy_mav_mark_16x9.yaml --generate-only --format ass  # check text
#   vidx -c examples/tcy_mav_mark_16x9.yaml -t 15 -y                     # check styling
#   vidx -c examples/tcy_mav_mark_16x9.yaml --gpu -y -w 4                # full run
#
# Layout, top to bottom (PlayRes is 1920x1080, so every number below is a
# literal pixel):
#
#   y 81-139    മർക്കോച്ച് 1          chapter title, alignment 8, MarginV 60
#   y 166-177   ▬▬▬▬▬▬▬▬▬             gold rule      \ one 2-line block,
#   y 206-227   Mavilan Tulu Bible    wordmark       / alignment 8, MarginV 183
#   y 609-686   Section heading       alignment 2, MarginV 330
#   y ~803-1020 Mark 1:1 / verse      alignment 2, MarginV 60
#   left        EGM Media text        alignment 4
#
# Those bands are measured, not estimated -- burn the .ass onto a blank frame
# and read the pixel rows back if you move anything:
#   ffmpeg -f lavfi -i color=black:s=1920x1080 -vf "ass=out.ass" -frames:v 1 f.png
#
# Only the EGM text sits at alignment 4/5/6, and that is deliberate: libass
# ignores MarginV at those alignments, so anything placed there is stuck dead
# centre with no way to nudge it. The title and the wordmark block are both at
# 8 for exactly this reason -- it is what makes the 27px gap under the title
# settable at all.
#
# Timings are VIDX's own (MRK-NN-timing.txt), phrase level, from --align.
# Chosen over SAB's C01-01-MRK-NN-timing.txt because SAB timed no \s heading
# segments: the narrator reads them, so SAB's contiguous verse rows absorb
# ~2s of heading audio at ~7 points per chapter and the heading style never
# fires. Verse starts agree with SAB to 0.16s median / 89% within 0.5s.
#
# The narrator reads each \s heading in about 2s, which is how long the timing
# row lasts, so heading.hold_seconds below keeps it up for the opening verses
# of its section instead. The next heading always cuts it off, so short
# sections hand over early and two headings never overlap.
#
# Backgrounds and music are assigned per chapter by shuffled round-robin
# (seed 20260804): random order, but balanced coverage — bgvideo 6/5/5 and
# bgmusic 4/3/3/3/3 — and no clip repeats in consecutive chapters. Pure random
# would likely have left one clip on 9 chapters and another on 2.
# ==============================================================================

project:
  name: "Mavilan Tulu — Gospel of Mark"
  output_dir: "output/tcy_mav_mrk"
  generate_only: false
  subtitle_format: "ass"

  # Feeds {language} in the publishing title/description/tag templates. Without
  # it batch_runner falls back to the literal string "Language", which is how
  # "MRK Chapter 01 — Language Audio Bible" ends up in publish_manifest.json.
  language: "Mavilan Tulu"

  # Feed {text_copyright} / {audio_copyright} in the description. REVIEW THESE
  # before publishing -- they are the attribution the whole book carries.
  text_copyright: "© New Life Computers India"
  audio_copyright: "© EGM Media"

video:
  resolution: "1920x1080"           # FHD 16:9
  fps: 24
  codec: "auto"
  preset: "fast"
  crf: 23

  # Per-chapter `background:` overrides this; kept as the fallback default.
  # All three clips are natively 16:9 (bgvideo-1 is 4K, -2 and -3 are FHD), so
  # `crop` is a clean downscale with nothing trimmed off the sides.
  background_media: "src/tcy-mav/bg-video/bgvideo-1.mp4"
  scaling_mode: "crop"

  # The clips run 12-22s against 8-minute chapters, so each loops 20-40 times.
  # loop_crossfade_sec dissolves the loop seam; VIDX bakes it into a cached
  # copy up front, so even the already-FHD clips get preprocessed (a hard cut
  # every 12s is very visible otherwise).
  loop_background: true
  loop_crossfade_sec: 1.0

  # EGM Media branding. logo.png is the EGM Media logo (globe + wordmark),
  # 500x500 RGBA; 0.08 of canvas width puts it at ~154px in the top-right.
  watermark:
    image: "src/tcy-mav/logo.png"
    position: "top-right"
    margin: 40
    scale: 0.08
    opacity: 0.75

audio:
  codec: "aac"
  bitrate: "192k"
  sample_rate: 48000
  background_music_volume: 0.15     # 15%; per-job music inherits this

style:
  verse:
    font: "Manjari"                 # must be installed on every rendering machine
    size: 80
    color: "#FFFFFF"
    outline_color: "#000000"
    outline_width: 3
    shadow: 1
    alignment: 2                    # bottom-centre
    margin_bottom: 60
    margin_lr: 60
    background_box: false
    background_color: "#000000"
    background_opacity: 0.50

  heading:
    font: "Manjari"
    size: 64
    color: "#FFD400"

    # Under the centred wordmark, not at the top — the chapter title has that
    # slot now. MarginV is honoured at alignment 2, so a 1-line heading runs
    # y609-686 and a 2-line one y532-686.
    #
    # 330 rather than 390 (where the wordmark used to sit) because headings
    # grow *upward*: the longest \s in this book is ~66 characters, which wraps
    # to two lines at size 64 inside the 1800px text width, and two lines at
    # 390 would reach y~536 — inside the wordmark block (y475-605). At 330 the
    # worst case tops out at y~606, and the bottom stays ~50px clear of the
    # tallest verse block (277px, top at y~803).
    alignment: 2
    margin_vertical: 330

    # Hold each heading over the opening verses of its section instead of the
    # ~2s the narrator takes to read it. The next heading's start always wins,
    # so a section shorter than 20s hands over early. "full" would keep one on
    # screen permanently.
    hold_seconds: 20

    bold: true
    background_box: false
    background_color: "#000000"
    background_opacity: 0.50

  verse_number:
    show: true
    color: "#FFC080"
    size: 44
    on_every_segment: false         # reference on the 'a' fragment only

  # ---------------------------------------------------------------------------
  # Persistent title, wordmark and text watermark.
  #
  # No background box is configured because none is possible: every Overlay*
  # style is emitted with ASS BorderStyle 1 (outline only) and a transparent
  # BackColour, hardcoded in ass_generator.py. Only `verse` and `heading` read
  # `background_box`. Contrast therefore comes from the outlines below.
  #
  # The generator derives overlay sizes from `verse.size` (80): title x1.5 =
  # 120, subtitle x0.75 = 60, watermark x0.65 = 52. The explicit values below
  # sit just under those — set by eye, not by formula.
  # ---------------------------------------------------------------------------
  overlay:
    enabled: true
    duration: "full"                # held to the last verse + 10s, i.e. whole chapter

    title: true                     # auto-derived from \h + chapter, e.g. "മർക്കോച്ച് 1"
    title_position: 8               # top-centre; see the alignment-5 note in the header
    title_margin_v: 60
    title_size: 108
    title_color: "#FFFFFF"
    title_outline_color: "#000000"
    title_outline_width: 4          # also drives the subtitle outline (shared in the generator)

    # A gold rule above the wordmark. The built-in `divider_line` can't do this:
    # its style hardcodes size 24 and takes its colour from title_color, so it
    # can be neither thick nor gold-while-the-title-stays-white.
    #
    # Instead the rule is an ASS vector drawing carried in the subtitle text.
    # The subtitle is the one overlay field written into the .ass verbatim
    # (ass_generator.py:402) rather than through clean_subtitle_text, so
    # override tags survive. A 460x12 gold bar in literal pixels. \bord0 stops
    # the style's 4px black outline from boxing it in; {\r} resets to the style
    # for the wordmark line. Being a drawing rather than a glyph (─, ▬) it
    # needs no font support.
    #
    # The y coordinates are -17..-5 rather than 0..12 to lift the bar clear of
    # the wordmark. subtitle_margin_v only moves the block as a whole; the space
    # *between* the two lines is line spacing, which no key exposes. Raising the
    # bar 17px inside its own drawing and adding 8 to margin_v to compensate
    # buys a 29px gap below it while keeping 27px above. Measured, not derived.
    subtitle: '{\c&H00D4FF&\bord0\shad0\p1}m 0 -17 l 460 -17 l 460 -5 l 0 -5{\p0}\N{\r}Mavilan Tulu Bible'

    # Tucked under the title rather than centred. Alignment 8 (not 5) because
    # libass honours MarginV at the top edge, so the gap under the title is
    # actually settable -- at 5 it would be centred with no way to move it.
    subtitle_alignment: 8
    subtitle_margin_v: 183
    subtitle_size: 54
    subtitle_color: "#FFFFFF"

    watermark_text: "Mavilan Tulu Bible — EGM Media"
    watermark_position: 4           # middle-left
    watermark_size: 47
    watermark_opacity: 0.60
    # watermark outline is fixed at 1px black, shadow 0, in the generator —
    # there is no watermark_outline_* key to widen it.

    divider_line: false             # defaults to true whenever a title or subtitle exists

# =============================================================================
# YouTube publishing
# =============================================================================
# enabled: false means a run writes publish_manifest.json and the offline
# packages but uploads nothing. Review the manifest, then flip to true and run
# `vidx -c ... --manifest` to upload from it.
#
# There is no videos().update() path in VIDX, so metadata cannot be patched
# after upload -- it has to be right before the run, which is why this is
# staged rather than one step.
#
# {h}  the book's own name from \h, i.e. മർക്കോച്ച്   ({book} is the \id code, MRK)
# {ch} short alias for {chapter}                     ({chapter:02d} still zero-pads)
# {chapters}  the timestamped chapter list, built from \s headings + their timings.
#             Only substituted in description_template.
# -----------------------------------------------------------------------------
publishing:
  platform: "youtube"
  enabled: false                   # <-- flip to true only after reviewing the manifest
  generate_offline_package: true

  # The app credentials. This identifies the *application*, not the channel --
  # which channel receives the videos is decided by token_file below.
  client_secrets_file: "~/.vidx/client_secrets.json"

  # Deliberately project-local rather than the shared ~/.vidx default: a stray
  # ~/.vidx/ben-personal.json token exists, and pointing at the wrong file
  # would upload 16 videos to a personal channel. First run opens a browser to
  # authorise; pick the Mavilan Tulu channel there and it is cached here.
  token_file: "output/tcy_mav_mrk/youtube_token.json"

  privacy_status: "unlisted"       # unlisted until reviewed; public is a one-way door
  category_id: "22"                # 22 = People & Blogs
  playlist_name: "മർക്കോച്ച് — Mavilan Tulu Audio Bible (Gospel of Mark)"

  title_template: "{h} {ch} - Mavilan Tulu Audio Bible"

  # First ~150 characters are what shows in search results and above the
  # "Show more" fold, so the searchable line comes first and the chapter list
  # follows. YouTube needs the timestamps on their own lines, starting at 0:00.
  description_template: |
    {h} {ch} — the Gospel of Mark chapter {ch}, read aloud in {language} with
    on-screen subtitles. Part of the complete {language} Audio Bible.

    Chapters
    {chapters}

    ---
    Scripture text: {text_copyright}
    Audio recording: {audio_copyright}
    Video produced by EGM Media.

    #MavilanTulu #AudioBible #GospelOfMark

  tags:
    - "Mavilan Tulu"
    - "Tulu"
    - "Audio Bible"
    - "Gospel of Mark"
    - "Mark {ch}"
    - "Scripture"
    - "{language}"

